services:
  # ─────────────────────────────────────────
  # PostgreSQL — stores drafts, approvals, captions
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: projectdigital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectdigital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectdigital}
      POSTGRES_DB: ${POSTGRES_DB:-projectdigital}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-applies db/schema.sql on FIRST boot (empty volume only).
      # To re-apply later, run psql manually — see db/schema.sql header.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectdigital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # n8n — workflow orchestration
  # Access at http://localhost:5678
  # ─────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: projectdigital_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-projectdigital}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-projectdigital}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Singapore
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Appsmith — legacy approval dashboard (being replaced by React app)
  # Kept running so we can compare side-by-side during the transition.
  # Remove this block once the React dashboard reaches feature parity.
  # ─────────────────────────────────────────
  appsmith:
    image: index.docker.io/appsmith/appsmith-ce:latest
    container_name: projectdigital_appsmith
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - appsmith_data:/appsmith-stacks
    depends_on:
      - postgres

  # ─────────────────────────────────────────
  # PostgREST — auto-generates a REST API over Postgres
  # The React dashboard reads/writes through this instead of a hand-rolled API.
  # Access at http://localhost:3001 (try http://localhost:3001/content_jobs)
  #
  # SECURITY NOTE: this exposes the projectdigital role as the anon role with
  # no auth. Bound to 127.0.0.1 only — do NOT expose to LAN/internet without
  # first creating a restricted web_anon role + JWT auth.
  # ─────────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:latest
    container_name: projectdigital_postgrest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-projectdigital}:${POSTGRES_PASSWORD:-projectdigital}@postgres:5432/${POSTGRES_DB:-projectdigital}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-projectdigital}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Dashboard — React + Vite (replaces Appsmith)
  # Access at http://localhost:3000
  # First boot runs `npm install` (slow ~1-2 min); subsequent restarts are fast
  # because node_modules lives in a named volume.
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: projectdigital_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_POSTGREST_URL=http://localhost:3001
      - VITE_N8N_BASE_URL=http://localhost:5678
    depends_on:
      - postgrest

  # Social scheduling: Metricool — managed SaaS, no Docker service needed.
  # n8n calls Metricool's REST API directly (paid plans only — free tier =
  # copy/paste captions from the dashboard into Metricool's UI manually).

  # ─────────────────────────────────────────
  # Transcript Service — yt-dlp sidecar for Branch 5 (Video Templates)
  # n8n's official image is a hardened Alpine build with no apk/python3, so
  # yt-dlp can't run inside the n8n container itself. This tiny Python
  # service exposes GET /transcript?url=<youtube_url> over the internal
  # compose network; n8n calls it like any other HTTP API. Used as a
  # fallback when Gemini's direct video-URL analysis fails — see
  # workflows/video-template-extract.README.md.
  # ─────────────────────────────────────────
  transcript-service:
    build:
      context: ./transcript-service
    container_name: projectdigital_transcript_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8811:8811"

volumes:
  postgres_data:
  n8n_data:
  appsmith_data:
  dashboard_node_modules:
