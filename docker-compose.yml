services:
  # ─────────────────────────────────────────
  # PostgreSQL — stores drafts, approvals, captions
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: projectdigital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectdigital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectdigital}
      POSTGRES_DB: ${POSTGRES_DB:-projectdigital}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-applies db/schema.sql on FIRST boot (empty volume only).
      # To re-apply later, run psql manually — see db/schema.sql header.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectdigital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # API — Python (FastAPI) backend: every AI step, approval gate and
  # external integration (replaced n8n 2026-10-29). See backend/README.md.
  # Access at http://localhost:8000 (interactive docs at /docs)
  # Reads API keys from .env. Code + prompts are mounted, and --reload
  # picks up edits without a rebuild.
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: projectdigital_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectdigital}:${POSTGRES_PASSWORD:-projectdigital}@postgres:5432/${POSTGRES_DB:-projectdigital}
      PUBLIC_API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-p9audgmp}
      SANITY_DATASET: ${SANITY_DATASET:-production}
      SANITY_API_TOKEN: ${SANITY_API_TOKEN:-}
      SITE_URL: ${SITE_URL:-https://project-digital-website.vercel.app}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
    volumes:
      - ./backend:/srv/backend
      - ./prompts:/srv/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # PostgREST — auto-generates a REST API over Postgres
  # The React dashboard reads/writes through this instead of a hand-rolled API.
  # Access at http://localhost:3001 (try http://localhost:3001/content_jobs)
  #
  # SECURITY NOTE: this exposes the projectdigital role as the anon role with
  # no auth. Bound to 127.0.0.1 only — do NOT expose to LAN/internet without
  # first creating a restricted web_anon role + JWT auth.
  # ─────────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:latest
    container_name: projectdigital_postgrest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-projectdigital}:${POSTGRES_PASSWORD:-projectdigital}@postgres:5432/${POSTGRES_DB:-projectdigital}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-projectdigital}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Dashboard — React + Vite (replaces Appsmith)
  # Access at http://localhost:3000
  # First boot runs `npm install` (slow ~1-2 min); subsequent restarts are fast
  # because node_modules lives in a named volume.
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: projectdigital_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_POSTGREST_URL=http://localhost:3001
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - postgrest
      - api

  # Social scheduling: Metricool — managed SaaS, no Docker service needed.
  # Free tier = copy/paste captions from the dashboard into Metricool's UI.

volumes:
  postgres_data:
  dashboard_node_modules:
